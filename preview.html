<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Vista previa — Matias Verde</title>
<style>
  @page{margin:0}
  html,body{margin:0;padding:0}
  body{
    width:1200px;height:630px;
    overflow:hidden;
    background:
      radial-gradient(70% 90% at 15% 0%, rgba(46,230,200,.13), transparent 60%),
      radial-gradient(60% 80% at 100% 100%, rgba(46,230,200,.07), transparent 55%),
      #0a0b0a;
    color:#eef2ef;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:64px 72px;
    box-sizing:border-box;
    -webkit-font-smoothing:antialiased;
  }

  .top{display:flex;align-items:center;gap:18px}
  .top svg{width:58px;height:58px;display:block}
  .top .t{line-height:1.15}
  .top strong{display:block;font-size:17px;font-weight:650;letter-spacing:.18em}
  .top span{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#98a29c;margin-top:5px}

  h1{
    margin:0;
    font-size:76px;
    line-height:1.02;
    letter-spacing:-.035em;
    font-weight:640;
  }

  .role{
    margin:20px 0 0;
    font-size:26px;
    line-height:1.35;
    color:#b9c3bd;
    max-width:820px;
  }

  .bottom{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:40px;
    border-top:1px solid rgba(255,255,255,.10);
    padding-top:26px;
  }

  .contact{display:flex;gap:34px;font-size:21px;color:#d5dcd8}
  .contact span{display:flex;align-items:center;gap:10px}
  .contact svg{width:20px;height:20px;color:#2ee6c8;flex:0 0 auto}

  .url{font-size:16px;color:#6f7a74;letter-spacing:.02em}
</style>
</head>
<body>

  <div class="top">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="p-t" x1="8" y1="52" x2="56" y2="8" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#0FBFA6"/>
          <stop offset="1" stop-color="#5DF0D8"/>
        </linearGradient>
        <radialGradient id="p-glow" cx="50%" cy="45%" r="50%">
          <stop offset="0" stop-color="#2EE6C8" stop-opacity=".18"/>
          <stop offset="1" stop-color="#2EE6C8" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect x=".5" y=".5" width="63" height="63" rx="16" fill="#0A1013" stroke="#20343A"/>
      <circle cx="32" cy="31" r="27" fill="url(#p-glow)"/>
      <path d="M13 45.5c0-13.2 9.2-23 22.8-23h3.2" fill="none" stroke="url(#p-t)" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="17.5" y="34" width="6" height="13" rx="2" fill="#2EE6C8"/>
      <rect x="27.5" y="26" width="6" height="21" rx="2" fill="#2EE6C8"/>
      <rect x="37.5" y="16" width="6" height="31" rx="2" fill="#F1F7F5"/>
      <path d="M20 47 46 21" fill="none" stroke="url(#p-t)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M37 21h9v9" fill="none" stroke="url(#p-t)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="t">
      <strong>GEN 3</strong>
      <span>Desarrollo y automatización</span>
    </div>
  </div>

  <div>
    <h1>Matias Verde</h1>
    <p class="role">Desarrollo web, sistemas a medida y automatización de procesos</p>
  </div>

  <div class="bottom">
    <div class="contact">
      <span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3h3l1.5 4-2 1.5a12 12 0 0 0 6.5 6.5L17 13l4 1.5v3a2 2 0 0 1-2.2 2A17 17 0 0 1 4 5.2 2 2 0 0 1 6 3z"/></svg>
        +54 9 353 412-8663
      </span>
      <span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6 8.5-6"/></svg>
        gen3vm@gmail.com
      </span>
    </div>
    <div class="url">mativ93.github.io/tarjeta</div>
  </div>

</body>
</html>
